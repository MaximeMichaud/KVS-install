server {
    listen                  443 ssl;
    http2 on;
    server_name             project_url;
    if ($host != $server_name) { return 444; }
    if ($http_host = "") { return 444; }
    set                     $base /var/www/domain.tld;
    root                    $base;

    # SSL
    ssl_certificate /etc/nginx/ssl/domain.tld/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/domain.tld/key.pem;

    # security
    include                 globals/security.conf;

    # index.php
    index                   index.php;

    # index.php fallback
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # logging
    access_log /var/log/nginx/domain.tld.access.log;
    error_log /var/log/nginx/domain.tld.error.log warn;

    # additional config
    # The installer replaces globals/kvs.conf with the KVS nginx_config.txt,
    # whose plain prefix locations mark these directories internal. They lose
    # to the asset regular expressions of globals/general.conf and to the PHP
    # handler below, so an asset extension under them would be served; deny
    # them first. These hold server-side files only: the admin panel serves
    # its own assets from admin/styles and admin/js, and the signup captcha
    # from the /captcha/ endpoint, never from these. _INSTALL holds the
    # installation files of the archive (install_db.sql, the rewrites,
    # install_permissions.sh), which stay there after a failed database
    # import for a retry. A regular expression, unlike a prefix location,
    # cannot clash with a /_INSTALL/ location in globals/kvs.conf.
    location ~ ^/(admin/(data|logs|smarty|stamp|template|tools)|tmp|_INSTALL)/ {
        deny all;
    }

    include globals/general.conf;
    include globals/kvs.conf;

    # admin/include holds the server side code, except the two scripts the
    # admin panel uploads through (file_upload_form_url and
    # file_upload_status_url in admin/js/config.php), which the PHP handler
    # must still serve; a ^~ prefix location would hide them from it.
    # admin/plugins is denied here, after globals/general.conf: a plugin's
    # admin page loads its JS and CSS from it.
    location ~ ^/admin/(include(?!/(uploader|get_upload_status)\.php$)|plugins)/ {
        deny all;
    }

    # Uploads land under contents/, where no PHP runs under any name: a .phar,
    # or up.phar/x.php.
    location ~* ^/contents/.*\.(?:php|phar)(?:/|$) {
        deny all;
    }

    # phpMyAdmin lives outside the site root. Its nested locations take
    # precedence over the generic PHP handler below for its own files, so the
    # alias resolves them under /usr/share/phpmyadmin instead of the site.
    location /phpmyadmin/ {
        alias /usr/share/phpmyadmin/;
        index index.php;

        # Nested handlers take precedence over server-level expressions.
        location ~ /\. {
            deny all;
        }

        location ~* ^/phpmyadmin/(.+\.(css|js|ico|gif|png|jpg|jpeg|svg|woff|woff2|ttf|eot))$ {
            alias /usr/share/phpmyadmin/$1;
            expires 180d;
            access_log off;
        }

        location ~ ^/phpmyadmin/(.+\.php)$ {
            alias /usr/share/phpmyadmin/$1;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            # The open_basedir the site handler sets through PHP_ADMIN_VALUE
            # stays on the PHP-FPM worker after its request, so this location
            # must set its own or the worker refuses the phpMyAdmin files.
            fastcgi_param PHP_ADMIN_VALUE "open_basedir=/usr/share/phpmyadmin/:/usr/lib/php/:/tmp/:/var/lib/php/sessions/";
            fastcgi_pass unix:/var/run/php/phpX.X-fpm.sock;
        }
    }

    # handle .php
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/phpX.X-fpm.sock;
        include globals/php_fastcgi.conf;
    }
    # protect videos from direct access
    location ^~ /contents/videos/ {
        root /var/www/domain.tld;
        #limit_rate_after 4M;
        internal;
        aio threads=default;
        mp4;
        mp4_buffer_size     1M;
        mp4_max_buffer_size 3M;
    }
}

# subdomains redirect
# server_name is a wildcard (*.domain, or .domain with USE_WWW=true) and
# selects the hosts already; $server_name holds that pattern, never a real
# host, so comparing $host with it would close every request.
server {
    listen                  443 ssl;
    http2 on;
    server_name             redirect_server_name;
    if ($http_host = "") { return 444; }

    # SSL
    ssl_certificate /etc/nginx/ssl/domain.tld/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/domain.tld/key.pem;
    return                  301 https://project_url$request_uri;
}

# HTTP redirect
server {
    listen      80;
    server_name .domain.tld;
    include     globals/letsencrypt.conf;

    location / {
        return 301 https://project_url$request_uri;
    }
}
