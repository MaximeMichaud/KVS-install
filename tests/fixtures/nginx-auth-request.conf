# Synthetic nginx -T fragments for screenshot authorization during import.
# configuration file /etc/nginx/moderation-privacy.conf:
location ^~ /contents/videos_sources/ { internal; }
location ~ ^/contents/videos_screenshots/([0-9]+)/([0-9]+)/ {
    set $screen_bucket $1;
    set $screen_video $2;
    set $screen_guard "";
    if (!-f $document_root/contents/videos_screenshots/$screen_bucket/$screen_video/.public) {
        set $screen_guard "U";
    }
    if (-f $document_root$uri) {
        set $screen_guard "${screen_guard}F";
    }
    if ($screen_guard = "UF") {
        rewrite ^(.*)$ /_guarded_screen$1 last;
    }
}
location ~ ^/_guarded_screen(/contents/videos_screenshots/.+)$ {
    internal;
    auth_request /_screen_auth;
    auth_request_set $screen_check $upstream_http_x_auth_check;
    error_page 401 403 =404 /404.php;
    expires -1;
    add_header Cache-Control "private, no-store" always;
    add_header X-Screen-Check $screen_check always;
    try_files $1 =404;
}
location = /_screen_auth {
    include privacy-fastcgi-params;
    fastcgi_param SCRIPT_FILENAME $document_root/authorize.php;
    fastcgi_param SCRIPT_NAME /authorize.php;
    fastcgi_param SCREEN_VIDEO_ID $screen_video;
    fastcgi_hide_header X-Powered-By;
    fastcgi_connect_timeout 1;
    fastcgi_read_timeout 1;
    include moderation-privacy-backend.conf;
}
# configuration file /etc/nginx/privacy-fastcgi-params:
fastcgi_param REQUEST_METHOD $request_method;
fastcgi_param QUERY_STRING $query_string;
fastcgi_param REDIRECT_STATUS 200;
# configuration file /etc/nginx/moderation-privacy-backend.conf:
internal;
fastcgi_pass unix:/run/php/php8.3-fpm.sock;
fastcgi_pass_request_body off;
fastcgi_pass_request_headers on;
fastcgi_param CONTENT_LENGTH "";
