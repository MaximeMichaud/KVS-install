# Synthetic nginx -T fragments: a members area behind an authorization subrequest.
# configuration file /etc/nginx/members-area.conf:
location ^~ /members/originals/ { internal; }
location ~ ^/members/([0-9]+)/(?!thumbs/) {
    set $member_album $1;
    if (-f $document_root$uri) {
        rewrite ^(.*)$ /_members_only$1 last;
    }
}
location ~ ^/_members_only(/members/.+)$ {
    internal;
    auth_request /_member_check;
    auth_request_set $member_check $upstream_http_x_auth_check;
    error_page 401 403 =404 /404.php;
    expires -1;
    add_header Cache-Control "private, no-store" always;
    add_header X-Member-Check $member_check always;
    try_files $1 =404;
}
location = /_member_check {
    include members-fastcgi-params;
    fastcgi_param SCRIPT_FILENAME $document_root/check_member.php;
    fastcgi_param SCRIPT_NAME /check_member.php;
    fastcgi_param MEMBER_ALBUM_ID $member_album;
    fastcgi_hide_header X-Powered-By;
    fastcgi_connect_timeout 1;
    fastcgi_read_timeout 1;
    include members-check-backend.conf;
}
# configuration file /etc/nginx/members-fastcgi-params:
fastcgi_param REQUEST_METHOD $request_method;
fastcgi_param QUERY_STRING $query_string;
fastcgi_param REDIRECT_STATUS 200;
# configuration file /etc/nginx/members-check-backend.conf:
internal;
fastcgi_pass unix:/run/php/php8.3-fpm.sock;
fastcgi_pass_request_body off;
fastcgi_pass_request_headers on;
fastcgi_param CONTENT_LENGTH "";
