name: pre-commit

# The hooks of .pre-commit-config.yaml, on every push to a branch and every
# pull request. Main requires this check before a pull request merges:
# Renovate merges the updates of these hooks by itself, and nothing else
# runs them before a commit does.
on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # The environments of the hooks, built once for each version of the
      # configuration.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # The hooks of the commit-msg and pre-push stages check a message or
      # the commits of a branch, which a run on the files leaves out.
      - name: the hooks, on every file
        run: |
          python -m pip install pre-commit==4.7.0
          pre-commit run --all-files --show-diff-on-failure
