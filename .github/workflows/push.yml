on: [ push, pull_request ]
name: ShellCheck
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ShellCheck release the pre-commit hook runs, not the newest one
      # on the day: Renovate moves both in the same pull request.
      - name: shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          version: v0.11.0
        env:
          SHELLCHECK_OPTS: -e SC1091,SC2034,SC2086,SC2154,SC2038
