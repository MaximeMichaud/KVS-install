name: tests

# The shell suites and the integration suites of tests/, on every push to a
# branch and every pull request. The release workflow calls this workflow as
# well, so a tag builds and pushes nothing before the suites of its commit
# pass.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  suites:
    name: shell suites
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PyYAML lets the workflow suite read the workflows as GitHub does, and
      # certtool (gnutls-bin) lets the internal TLS suite check its trust with
      # GnuTLS, the library of the wget in the PHP images, as well as with
      # OpenSSL. The runner image has every other tool the suites use, Docker
      # with Compose, PHP, rsync, zstd and 7-Zip among them. The suites check
      # the scripts against GNU coreutils, those of the Debian releases the
      # stack supports: an image whose coreutils are the uutils ones, which
      # Ubuntu defaults to from 26.04 on, gets GNU coreutils first, as the
      # uutils sort also leaves a temporary directory behind in a TMPDIR that
      # one of the suites checks stays empty.
      - name: the tools the suites use
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gettext-base uidmap python3-yaml gnutls-bin acl
          if sort --version | grep -q uutils; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              --allow-remove-essential coreutils-from-gnu coreutils-from-uutils-
          fi
          sort --version | sed -n 1p
          sort --version | grep -q 'GNU coreutils'
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
          certtool --version | sed -n 1p

      # The phpMyAdmin suite runs as root of a user namespace of its own,
      # mapped onto the subordinate ids that as-uid-1000.sh gives the user
      # the suites run as. Ubuntu takes every capability away inside a
      # namespace an unconfined program creates while this sysctl is on.
      - name: user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          .github/scripts/as-uid-1000.sh unshare --map-auto --map-root-user --net id -u

      # The release builds nginx, init and manticore from the base their
      # Dockerfile names by default, so that base has to be the one the lock
      # pins. The compose files run the Alpine of the lock for
      # phpmyadmin-init, the one the suites run its init.sh with.
      - name: the Dockerfiles and the compose files are on the lock
        run: ./docker/bin/resolve-bases.sh --check-dockerfiles

      # As uid 1000: the scripts the suites exercise give the site's files
      # to 1000:1000, which the runner user, uid 1001, may not. With CI set,
      # a suite that needs Docker fails when Docker is missing, where a
      # workstation without it only skips that part and says so.
      - name: the suites
        env:
          CI: "true"
        run: .github/scripts/as-uid-1000.sh tests/run.sh

      # CentOS 7 ships Bash 4.2, the oldest the exporter supports. As uid
      # 1000, like the suites above.
      - name: exporter suites on Bash 4.2
        run: >-
          docker run --rm --network none --user 1000:1000 -v "$PWD:/src:ro" -w /src
          centos:7.9.2009@sha256:be65f488b7764ad3638f236b7b515b3678369a5124c47b8d32916d6487418ea4
          bash -c 'bash tests/test_kvs_export.sh && DURABLE_PUBLISH_KINDS=export bash tests/test_durable_publish.sh'

  # The integration suites, on real containers: nginx, Caddy, MariaDB,
  # Manticore and PHP-FPM on internal networks, with synthetic sites. They
  # run on the images docker/images.lock pins, which tests/run-integration.sh
  # pulls first, and build the images they check from this commit. The
  # suites of the PHP-FPM and cron images run in the docker images workflow,
  # on the images its build jobs make. As uid 1000 on GNU coreutils, the way
  # the shell suites run.
  integration:
    name: integration suites
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: GNU coreutils
        run: |
          if sort --version | grep -q uutils; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              --allow-remove-essential coreutils-from-gnu coreutils-from-uutils-
          fi
          sort --version | sed -n 1p
          sort --version | grep -q 'GNU coreutils'

      - name: the suites
        env:
          CI: "true"
        run: .github/scripts/as-uid-1000.sh tests/run-integration.sh

  # The jobs of the release workflow run the scripts of .github/scripts on
  # the runner as it comes, uutils coreutils included where its Ubuntu
  # defaults to them (26.04 and later), while the suites job above switches
  # to GNU coreutils. The suites of those scripts run here once more, on the
  # coreutils they run with in a release.
  release-scripts:
    name: release scripts, runner coreutils
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PyYAML lets the workflow suite read the workflows as GitHub does.
      - name: the tools the suites use
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-yaml
          sort --version | sed -n 1p

      - name: the release script suites
        env:
          CI: "true"
        run: |
          for suite in tests/test_release_*.sh; do
            echo "Running ${suite#tests/}"
            "$suite"
          done

  mysql-dumps:
    name: replay ${{ matrix.source_image }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        source_image:
          - mysql:8.4@sha256:8c233bad33d520a7aae1c1e619c3a9775f4a1ba2d463d692fada04ec7f40be00
          - mysql:5.7.44@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: prepare and replay the source dump
        env:
          SOURCE_IMAGE: ${{ matrix.source_image }}
        run: tests/integration_mysql_dump.sh --pull "$SOURCE_IMAGE"

  compatibility:
    name: legacy PHP and BusyBox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep zip, unzip and the installer shell on the runner. Both PHP CLI
      # names execute the same container binary against the shared fixtures.
      - name: project URL parser on PHP 7.4
        env:
          PROJECT_URL_PHP_VERSION: "7.4"
        run: |
          TMPDIR=$(mktemp -d)
          export TMPDIR
          user="$(id -u):$(id -g)"
          container=$(docker run -d --network none --user "$user" -v "$TMPDIR:$TMPDIR" \
            php:7.4-cli@sha256:620a6b9f4d4feef2210026172570465e9d0c1de79766418d3affd09190a7fda5 sleep infinity)
          trap 'docker rm -f "$container" >/dev/null; rm -rf "$TMPDIR"' EXIT
          printf '#!/bin/sh\nexec "%s" exec -i "%s" php "$@"\n' "$(command -v docker)" "$container" > "$TMPDIR/php"
          chmod +x "$TMPDIR/php"
          ln -s php "$TMPDIR/php7.4"
          export PATH="$TMPDIR:$PATH"
          php7.4 -r 'exit(PHP_VERSION_ID >= 70400 && PHP_VERSION_ID < 70500 ? 0 : 1);'
          tests/test_install_project_url.sh
      - name: archive on BusyBox
        run: docker run --rm --network none --user 1000:1000 -v "$PWD:/src:ro" -w /src bash:5.2@sha256:2cf7ddaf5f6369c16a0359e3bd48e54ada211a2e4e90d87532ad2958d642bdd5 bash tests/test_kvs_export.sh --busybox /bin/busybox
