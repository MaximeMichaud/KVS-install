name: docker images

# The suites of the PHP-FPM and cron images run here, on the images the build
# jobs make, so a change to one of them, or to the kvsctl cache command the
# cache suite drives, runs this workflow as well.
on:
  push:
    paths:
      - "docker/**"
      - ".github/workflows/docker.yml"
      - "tests/integration_php_security.py"
      - "tests/integration_php_sessions.py"
      - "tests/integration_cache.py"
      - "tests/fixtures/cache-probe.php"
      - "cli/internal/upgrade/cache*"
  pull_request:
    paths:
      - "docker/**"
      - ".github/workflows/docker.yml"
      - "tests/integration_php_security.py"
      - "tests/integration_php_sessions.py"
      - "tests/integration_cache.py"
      - "tests/fixtures/cache-probe.php"
      - "cli/internal/upgrade/cache*"
  # docker/images.lock pins every base and runtime image by digest, so an
  # upstream rebuild of a tag (a security fix, usually) reaches the stack only
  # when a maintainer refreshes the lock. The weekly lock job fails while the
  # lock is stale, which is the reminder; it also runs on demand.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hadolint:
    name: hadolint
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lint every Dockerfile
        run: |
          files=$(find docker -name Dockerfile | sort)
          echo "$files"
          # Word splitting is what passes one argument per Dockerfile.
          # shellcheck disable=SC2086
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e hadolint $files

  build:
    name: build ${{ matrix.service }}${{ matrix.php && format(' php{0}', matrix.php) || '' }}${{ matrix.arch && format(' {0}', matrix.arch) || '' }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    # An entry without arch builds linux/amd64. The PHP-FPM and cron images
    # also build for linux/arm64, on GitHub's arm64 runner: their ionCube
    # loader and yt-dlp are native code pinned per architecture, and the
    # build runs both, which needs the architecture itself, not an emulation.
    # GitHub has no floating label for its arm64 runners: those entries name
    # a release, which moves by hand when ubuntu-latest moves to a newer one.
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: nginx, context: docker/nginx, base: "", php: "" }
          - { service: init, context: docker/init, base: "", php: "" }
          - { service: manticore, context: docker/manticore, base: "", php: "" }
          - { service: php, context: docker/php, base: php-fpm, php: "8.1" }
          - { service: php, context: docker/php, base: php-fpm, php: "8.2" }
          - { service: php, context: docker/php, base: php-fpm, php: "8.3" }
          - { service: php, context: docker/php, base: php-fpm, php: "8.4" }
          - { service: cron, context: docker/cron, base: php-cli, php: "8.1" }
          - { service: cron, context: docker/cron, base: php-cli, php: "8.2" }
          - { service: cron, context: docker/cron, base: php-cli, php: "8.3" }
          - { service: cron, context: docker/cron, base: php-cli, php: "8.4" }
          - { service: php, context: docker/php, base: php-fpm, php: "8.1", arch: arm64, runner: ubuntu-24.04-arm }
          - { service: php, context: docker/php, base: php-fpm, php: "8.2", arch: arm64, runner: ubuntu-24.04-arm }
          - { service: php, context: docker/php, base: php-fpm, php: "8.3", arch: arm64, runner: ubuntu-24.04-arm }
          - { service: php, context: docker/php, base: php-fpm, php: "8.4", arch: arm64, runner: ubuntu-24.04-arm }
          - { service: cron, context: docker/cron, base: php-cli, php: "8.1", arch: arm64, runner: ubuntu-24.04-arm }
          - { service: cron, context: docker/cron, base: php-cli, php: "8.2", arch: arm64, runner: ubuntu-24.04-arm }
          - { service: cron, context: docker/cron, base: php-cli, php: "8.3", arch: arm64, runner: ubuntu-24.04-arm }
          - { service: cron, context: docker/cron, base: php-cli, php: "8.4", arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The builder runs this BuildKit, pinned like the actions: the default
      # is moby/buildkit:buildx-stable-1, a tag that moves.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: build arguments
        id: args
        env:
          PHP_SERIES: ${{ matrix.php }}
          BASE_NAME: ${{ matrix.base }}
        run: |
          {
            echo 'value<<ARGS_EOF'
            if [ -n "$PHP_SERIES" ]; then
              echo "PHP_VERSION=${PHP_SERIES}"
              echo "PHP_BASE=$(./docker/bin/resolve-bases.sh --get "$BASE_NAME" "$PHP_SERIES")"
            fi
            echo 'ARGS_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch || 'amd64' }}
          push: false
          # The PHP-FPM and cron images go to Docker for their suites.
          load: ${{ matrix.service == 'php' || matrix.service == 'cron' }}
          provenance: false
          sbom: false
          build-args: ${{ steps.args.outputs.value }}
          tags: kvs-install/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}${{ matrix.php }}${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}${{ matrix.php }}${{ matrix.arch }}

      # On the binaries of the image just built, on its own architecture: the
      # PHP release of its base, the extensions the stack needs and the PHP
      # 8.1 security backport; for PHP-FPM, consecutive requests with and
      # without ionCube, and the sessions kept in their volume across a
      # recreated container.
      - name: the suites of the image
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: kvs-install/${{ matrix.service }}:ci
        run: |
          case "$SERVICE" in
            php|cron) ;;
            *) echo "The ${SERVICE} image has no suite of its own here."; exit 0 ;;
          esac
          version=$(docker image inspect "$IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' |
            sed -n 's/^PHP_VERSION=//p')
          if [ "$SERVICE" = php ]; then
            python3 tests/integration_php_security.py "$IMAGE" "$version" --fpm
            python3 tests/integration_php_sessions.py "$IMAGE"
          else
            python3 tests/integration_php_security.py "$IMAGE" "$version"
          fi

      # The cache suite runs the PHP-FPM and cron images of PHP 8.1 together,
      # in the job below: their linux/amd64 entries hand it their image.
      - name: the image for the cache suite
        if: matrix.php == '8.1' && !matrix.arch
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -o pipefail
          docker save "kvs-install/${SERVICE}:ci" | zstd -T0 -3 -q -o "${RUNNER_TEMP}/cache-suite-${SERVICE}.tar.zst"
      - if: matrix.php == '8.1' && !matrix.arch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-suite-${{ matrix.service }}
          path: ${{ runner.temp }}/cache-suite-${{ matrix.service }}.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Direct cache access and the legacy loopback, through the PHP-FPM and cron
  # images of PHP 8.1 the build jobs made, an nginx built from this commit
  # and the Dragonfly and Memcached of docker/images.lock, with the cache
  # command of kvsctl. It runs when the builds ran, on push and pull request.
  cache:
    name: cache suite
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The suite runs the real-Docker test of the kvsctl cache command.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cache-suite-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - name: the images
        run: |
          set -o pipefail
          for archive in "$RUNNER_TEMP"/images/cache-suite-*.tar.zst; do
            zstd -d -q -c "$archive" | docker load
          done
          docker build --quiet --tag kvs-install/nginx:ci docker/nginx
          for backend in dragonfly memcached; do
            image=$(./docker/bin/resolve-bases.sh --get "$backend")
            docker pull --quiet "$image"
          done
      - name: the cache suite
        env:
          KVS_CACHE_TEST_PHP_IMAGE: kvs-install/php:ci
          KVS_CACHE_TEST_CRON_IMAGE: kvs-install/cron:ci
          KVS_CACHE_TEST_NGINX_IMAGE: kvs-install/nginx:ci
        run: python3 tests/integration_cache.py

  # Reads every pinned tag from its registry again (docker buildx imagetools,
  # which the runner has) and compares with the lock. A difference means an
  # upstream image moved: run docker/bin/resolve-bases.sh, review the diff and
  # commit the lock, so the next release builds on the new bases.
  lock:
    name: images.lock is current
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: resolve every pinned tag again
        run: ./docker/bin/resolve-bases.sh --check
