services:
  nginx:
    build:
      context: ./nginx
    container_name: ${SITE_PREFIX:-kvs}-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - DOMAIN=${DOMAIN}
      - USE_WWW=${USE_WWW:-false}
      - PROJECT_HTTPS_PORT=${PROJECT_HTTPS_PORT:-443}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../conf/nginx/templates:/etc/nginx/templates:ro
      - ../conf/nginx/globals:/etc/nginx/globals:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
      - /var/www/${DOMAIN}:/var/www/kvs
      - manticore-api:/var/www/manticore-api
      - phpmyadmin-data:/usr/share/phpmyadmin:ro
      - acme-certs:/etc/nginx/ssl
      - letsencrypt-webroot:/var/www/_letsencrypt
      - nginx-logs:/var/log/nginx
      - nginx-includes:/etc/nginx/includes:ro
    depends_on:
      - php-fpm
    healthcheck:
      # Port 80 answers the HTTPS redirect from Nginx alone, so the probe
      # stays green while PHP-FPM restarts. curl ships with the nginx image.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      kvs-network:
        aliases:
          - ${DOMAIN}
          - www.${DOMAIN}
          - manticore-api

  php-fpm:
    build:
      context: ./php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.1}
        # The base of the series, pinned by digest in docker/images.lock and
        # written to .env by setup.sh. The fallback keeps a bare .env
        # building: an empty build arg would erase the Dockerfile default.
        PHP_BASE: ${PHP_FPM_BASE:-php:${PHP_VERSION:-8.1}-fpm}
    container_name: ${SITE_PREFIX:-kvs}-php
    restart: unless-stopped
    volumes:
      - /var/www/${DOMAIN}:/var/www/kvs
      - manticore-api:/var/www/manticore-api
      - phpmyadmin-data:/usr/share/phpmyadmin
      - ./php/php.ini:/usr/local/etc/php/conf.d/kvs.ini:ro
      - ./geoip:/usr/share/geoip:ro
    environment:
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-512M}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-2048M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-2048M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      # Read when the container starts: the loader ships in every image and
      # the entrypoint disables it, so switching is a restart, not a rebuild.
      - IONCUBE=${IONCUBE:-YES}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      # socat is installed in the image (php/Dockerfile) and a TCP connect
      # proves the FastCGI master accepts requests, which "php-fpm -t" only
      # tells about the configuration file.
      test: ["CMD", "socat", "-u", "/dev/null", "TCP:127.0.0.1:9000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kvs-network

  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.8}
    container_name: ${SITE_PREFIX:-kvs}-mariadb
    restart: unless-stopped
    ports:
      # Localhost only - safe for kvs-cli access
      - "127.0.0.1:${MARIADB_HOST_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?error}
      MARIADB_DATABASE: ${DOMAIN:?error}
      MARIADB_USER: ${DOMAIN}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?error}
      # Create mysql@localhost user for healthcheck (doesn't need password)
      MARIADB_MYSQL_LOCALHOST_USER: 1
      # A release that moves the MariaDB series needs the system tables
      # upgraded at the first start; the entrypoint does it with this set.
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kvs-network

  memcached:
    image: memcached:alpine
    container_name: ${SITE_PREFIX:-kvs}-memcached
    hostname: cache
    restart: unless-stopped
    command: memcached -m ${CACHE_MEMORY:-256}
    ports:
      # Localhost only - for kvs-cli access
      - "127.0.0.1:${CACHE_HOST_PORT:-11211}:11211"
    networks:
      kvs-network:
        aliases:
          - cache
    profiles:
      - memcached

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: ${SITE_PREFIX:-kvs}-dragonfly
    hostname: cache
    restart: unless-stopped
    # Dragonfly needs 256 MB of maxmemory per proactor thread; setup.sh keeps
    # CACHE_MEMORY and CACHE_THREADS consistent with the host.
    command: dragonfly --memcached_port=11211 --maxmemory=${CACHE_MEMORY:-512}mb --proactor_threads=${CACHE_THREADS:-2} --logtostderr
    ports:
      # Localhost only - for kvs-cli access
      - "127.0.0.1:${CACHE_HOST_PORT:-11211}:11211"
    ulimits:
      memlock: -1
    networks:
      kvs-network:
        aliases:
          - cache
    profiles:
      - dragonfly

  manticore:
    build:
      context: ./manticore
    container_name: ${SITE_PREFIX:-kvs}-manticore
    hostname: searchd
    restart: unless-stopped
    ports:
      # Localhost only - for kvs-cli access
      - "127.0.0.1:${MANTICORE_MYSQL_HOST_PORT:-9306}:9306"  # MySQL protocol
      - "127.0.0.1:${MANTICORE_HTTP_HOST_PORT:-9308}:9308"  # HTTP protocol
    environment:
      - DOMAIN=${DOMAIN}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - TABLES_PREFIX=${TABLES_PREFIX:-ktvs_}
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock: -1
    volumes:
      - manticore-data:/var/lib/manticore
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      # searchd answers SHOW STATUS on the MySQL port, and the image carries
      # the MariaDB client for the indexer. The entrypoint builds every index
      # before it starts searchd, so the first answer can be minutes away on a
      # large site: the start period keeps the container reported as starting
      # instead of unhealthy until then.
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -P 9306 -e 'SHOW STATUS' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    networks:
      kvs-network:
        aliases:
          - searchd
    profiles:
      - manticore

  acme:
    image: neilpang/acme.sh
    container_name: ${SITE_PREFIX:-kvs}-acme
    restart: unless-stopped
    profiles:
      - direct-tls
    command: daemon
    volumes:
      - acme-data:/acme.sh
      - acme-certs:/etc/nginx/ssl
      - letsencrypt-webroot:/var/www/_letsencrypt
    networks:
      - kvs-network

  cron:
    build:
      context: ./cron
      args:
        PHP_VERSION: ${PHP_VERSION:-8.1}
        PHP_BASE: ${PHP_CLI_BASE:-php:${PHP_VERSION:-8.1}-cli}
    container_name: ${SITE_PREFIX:-kvs}-cron
    restart: unless-stopped
    volumes:
      - /var/www/${DOMAIN}:/var/www/kvs
      - ./geoip:/usr/share/geoip:ro
    environment:
      - IONCUBE=${IONCUBE:-YES}
    depends_on:
      # Started, never healthy: the KVS tasks run PHP in this container and
      # waiting for the PHP-FPM socket would only delay the first tick.
      php-fpm:
        condition: service_started
      mariadb:
        condition: service_started
    healthcheck:
      # The container listens on nothing, so the daemon itself is the signal.
      # procps is installed (cron/Dockerfile) and cron runs as PID 1.
      test: ["CMD", "pgrep", "-x", "cron"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kvs-network

  # Init container - runs once to setup KVS
  kvs-init:
    build:
      context: ./init
    container_name: ${SITE_PREFIX:-kvs}-init
    volumes:
      - /var/www/${DOMAIN}:/var/www/kvs
      - manticore-api:/var/www/manticore-api
      - ./kvs-archive:/kvs-archive:ro
      - ./geoip:/usr/share/geoip:ro
      - nginx-includes:/nginx-includes
    environment:
      - DOMAIN=${DOMAIN}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - USE_WWW=${USE_WWW:-false}
      - SSL_PROVIDER=${SSL_PROVIDER:-letsencrypt}
      - ENABLE_MANTICORE=${ENABLE_MANTICORE:-false}
      - PROJECT_HTTPS_PORT=${PROJECT_HTTPS_PORT:-443}
      - KVS_ADMIN_PASSWORD=${KVS_ADMIN_PASSWORD:-}
      - DISABLE_KVS_SUPPORT_ACCESS=${DISABLE_KVS_SUPPORT_ACCESS:-false}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - kvs-network
    profiles:
      - setup

  phpmyadmin-init:
    image: alpine:latest
    container_name: ${SITE_PREFIX:-kvs}-phpmyadmin-init
    entrypoint: ["/usr/local/bin/init-phpmyadmin"]
    volumes:
      - phpmyadmin-data:/usr/share/phpmyadmin
      - ./phpmyadmin/init.sh:/usr/local/bin/init-phpmyadmin:ro
    profiles:
      - setup

networks:
  kvs-network:
    driver: bridge

# Volumes: Docker managed (default)
# For bind mounts (direct file access), create docker-compose.override.yml:
#   services:
#     nginx:
#       volumes:
#         - /var/www/${DOMAIN}:/var/www/kvs
#     php-fpm:
#       volumes:
#         - /var/www/${DOMAIN}:/var/www/kvs
#     cron:
#       volumes:
#         - /var/www/${DOMAIN}:/var/www/kvs
#     kvs-init:
#       volumes:
#         - /var/www/${DOMAIN}:/var/www/kvs
volumes:
  manticore-api:
  mariadb-data:
  acme-data:
  acme-certs:
  letsencrypt-webroot:
  phpmyadmin-data:
  nginx-logs:
  nginx-includes:
  manticore-data:
