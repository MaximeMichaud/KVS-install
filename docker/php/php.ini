; KVS PHP Configuration
upload_max_filesize = 2048M
post_max_size = 2048M
memory_limit = 512M
max_input_vars = 10000
max_execution_time = 300
max_input_time = 360

; Opcache settings for production
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1

; Session (files - dragonfly doesn't support PHP sessions via memcached)
; No session.save_path here: the entrypoint keeps the sessions in the
; php-sessions volume when docker-compose.yml mounts it, so an upgrade, which
; recreates the container, logs nobody out, and in /tmp otherwise. A
; session.save_path set here still wins.
session.save_handler = files

; Error handling (disable in production)
display_errors = Off
; With no error_log, PHP-FPM hands the errors to the container output
; (docker compose logs php-fpm), which Docker caps.
log_errors = On
